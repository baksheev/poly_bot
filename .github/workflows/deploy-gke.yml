      - name: Bootstrap reviewed ARB inventory once
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -Eeuo pipefail
          marker="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o json | jq -r '.metadata.annotations["arb-bot/arb-inventory-bootstrap-v1"] // empty')"
          if [[ "${marker}" == complete:* ]]; then
            echo "ARB inventory bootstrap is already durably marked complete."
            exit 0
          fi

          test "$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.replicas}')" = 1
          kubectl wait deployment/arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            --for=condition=Available \
            --timeout=60s

          template="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o json | jq -c '.spec.template')"
          bootstrap_owner="arb-bot-arb-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stop_owner="arb-bot-arb-entry-stop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          clear_owner="arb-bot-arb-entry-clear-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          apply_operation_owner() {
            owner="$1"
            init_name="$2"
            operation="$3"
            jq -n \
              --argjson template "${template}" \
              --arg owner "${owner}" \
              --arg init_name "${init_name}" \
              --arg image "${IMAGE}" \
              --arg operation "${operation}" \
              '
                ($template.spec.containers[] | select(.name == "arb-bot")) as $runtime
                | {
                    apiVersion: "apps/v1",
                    kind: "Deployment",
                    metadata: {
                      name: $owner,
                      labels: {"app.kubernetes.io/name": $owner}
                    },
                    spec: {
                      replicas: 1,
                      revisionHistoryLimit: 0,
                      strategy: {type: "Recreate"},
                      selector: {matchLabels: {"arb-bot/bootstrap-instance": $owner}},
                      template: (
                        $template
                        | .metadata.labels = {
                            "app.kubernetes.io/name": $owner,
                            "arb-bot/bootstrap-instance": $owner
                          }
                        | .metadata.annotations = {}
                        | .spec.automountServiceAccountToken = false
                        | .spec.restartPolicy = "Always"
                        | .spec.initContainers = [
                            ($runtime
                              | .name = $init_name
                              | .image = $image
                              | del(.startupProbe, .readinessProbe, .livenessProbe)
                              | .resources = {
                                  "requests": {"cpu": "20m", "memory": "32Mi"},
                                  "limits": {"cpu": "250m", "memory": "256Mi"}
                                }
                              | .command = ["/bin/sh", "-ec"]
                              | .args = [$operation]
                              | .terminationMessagePath = "/dev/termination-log"
                              | .terminationMessagePolicy = "File")
                          ]
                        | .spec.containers = [
                            ($runtime
                              | .name = "hold"
                              | .image = $image
                              | del(.startupProbe, .readinessProbe, .livenessProbe)
                              | .resources = {
                                  "requests": {"cpu": "5m", "memory": "8Mi"},
                                  "limits": {"cpu": "20m", "memory": "16Mi"}
                                }
                              | .command = ["/bin/sh", "-ec"]
                              | .args = ["sleep 3600"])
                          ]
                      )
                    }
                  }
              ' | kubectl apply --namespace "${GKE_NAMESPACE}" -f -
          }

          wait_operation_owner() {
            owner="$1"
            init_name="$2"
            maximum_polls="$3"
            operation_pod=
            for _ in {1..60}; do
              operation_pod="$(kubectl get pods \
                --namespace "${GKE_NAMESPACE}" \
                --selector="arb-bot/bootstrap-instance=${owner}" \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              test -z "${operation_pod}" || break
              sleep 2
            done
            test -n "${operation_pod}"

            operation_reason=
            for ((poll = 0; poll < maximum_polls; poll++)); do
              operation_reason="$(kubectl get pod "${operation_pod}" \
                --namespace "${GKE_NAMESPACE}" \
                -o jsonpath='{.status.initContainerStatuses[0].state.terminated.reason}' \
                2>/dev/null || true)"
              case "${operation_reason}" in
                Completed) break ;;
                Error)
                  kubectl logs "${operation_pod}" \
                    --namespace "${GKE_NAMESPACE}" \
                    --container "${init_name}" || true
                  return 1
                  ;;
              esac
              sleep 2
            done
            if test "${operation_reason}" != Completed; then
              kubectl describe pod "${operation_pod}" \
                --namespace "${GKE_NAMESPACE}" || true
              return 1
            fi
            operation_message="$(kubectl get pod "${operation_pod}" \
              --namespace "${GKE_NAMESPACE}" \
              -o json \
              | jq -r '.status.initContainerStatuses[0].state.terminated.message // empty')"
            test -z "${operation_message}" || echo "${operation_message}"
          }

          delete_operation_owner() {
            owner="$1"
            kubectl delete deployment "${owner}" \
              --namespace "${GKE_NAMESPACE}" \
              --ignore-not-found \
              --wait=false >/dev/null
            kubectl wait pod \
              --namespace "${GKE_NAMESPACE}" \
              --selector="arb-bot/bootstrap-instance=${owner}" \
              --for=delete \
              --timeout=120s
          }

          restore_old_owner=false
          cleanup_bootstrap() {
            status="$?"
            trap - EXIT
            helpers_gone=true
            for owner in "${bootstrap_owner}" "${stop_owner}" "${clear_owner}"; do
              if ! delete_operation_owner "${owner}" >/dev/null 2>&1; then
                helpers_gone=false
              fi
            done
            if [[ "${restore_old_owner}" == true ]]; then
              if [[ "${helpers_gone}" == true ]]; then
                kubectl patch deployment arb-bot \
                  --namespace "${GKE_NAMESPACE}" \
                  --type=json \
                  --patch='[{"op":"replace","path":"/spec/replicas","value":1}]' \
                  >/dev/null || true
                kubectl rollout status deployment/arb-bot \
                  --namespace "${GKE_NAMESPACE}" \
                  --timeout=180s || true
              else
                echo "::error::bootstrap helper still exists; refusing to restore a concurrent production owner"
              fi
            fi
            exit "${status}"
          }
          trap cleanup_bootstrap EXIT

          apply_operation_owner \
            "${stop_owner}" \
            entry-stop \
            'rm -f "${ARBITRAGE_ENTRY_STOP_FILE}.recovery-safe"; : >"${ARBITRAGE_ENTRY_STOP_FILE}"; attempts=0; while test "${attempts}" -lt 900; do if test -s "${ARBITRAGE_ENTRY_STOP_FILE}.recovery-safe" && grep -qx "active_operation_count=0" "${ARBITRAGE_ENTRY_STOP_FILE}.recovery-safe"; then exit 0; fi; attempts=$((attempts + 1)); sleep 1; done; exit 1'
          wait_operation_owner "${stop_owner}" entry-stop 470
          delete_operation_owner "${stop_owner}"

          kubectl patch deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            --type=json \
            --patch='[{"op":"replace","path":"/spec/replicas","value":0}]'
          restore_old_owner=true
          kubectl wait pod \
            --namespace "${GKE_NAMESPACE}" \
            --selector='app.kubernetes.io/name=arb-bot' \
            --for=delete \
            --timeout=120s

          apply_operation_owner \
            "${bootstrap_owner}" \
            bootstrap \
            'export BINANCE_API_KEY="$(cat /var/run/secrets/arb-bot/BINANCE_API_KEY)"; export BINANCE_SECRET_KEY="$(cat /var/run/secrets/arb-bot/BINANCE_SECRET_KEY)"; if report="$(arb_bot bootstrap-arb-inventory --quote-usdc 500 --journal-path /var/lib/arb-bot/arb-bootstrap-binance.journal --live-confirmation BOOTSTRAP_ARB_WITH_500_USDC 2>&1)"; then printf "%s\n" "${report}" | tee /dev/termination-log; else status=$?; printf "%s\n" "${report}" | tee /dev/termination-log; exit "${status}"; fi'
          wait_operation_owner "${bootstrap_owner}" bootstrap 310
          delete_operation_owner "${bootstrap_owner}"

          kubectl patch deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            --type=json \
            --patch='[{"op":"replace","path":"/spec/replicas","value":1}]'
          kubectl rollout status deployment/arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            --timeout=180s

          apply_operation_owner \
            "${clear_owner}" \
            entry-clear \
            'rm -f "${ARBITRAGE_ENTRY_STOP_FILE}" "${ARBITRAGE_ENTRY_STOP_FILE}.recovery-safe"'
          wait_operation_owner "${clear_owner}" entry-clear 70
          delete_operation_owner "${clear_owner}"

          kubectl annotate deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            --overwrite \
            "arb-bot/arb-inventory-bootstrap-v1=complete:${SOURCE_SHA}"
          restore_old_owner=false
          trap - EXIT

      - name: Roll out on the fixed node
        id: rollout
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          EVM_WALLET_ADDRESS: ${{ vars.EVM_WALLET_ADDRESS }}
          REBALANCE_MAX_WLD_AMOUNT: ${{ vars.REBALANCE_MAX_WLD_AMOUNT }}
          REBALANCE_MAX_USDC_AMOUNT: ${{ vars.REBALANCE_MAX_USDC_AMOUNT }}
        run: |
          set -Eeuo pipefail
          had_previous=true
          fixed_pool="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.nodeSelector.cloud\.google\.com/gke-nodepool}')"
          test -n "${fixed_pool}"
          previous_runtime_data="null"
          previous_durable_schema_version=0
          durable_schema_version=2
          automatic_rollback_allowed=false
          rollout_applied=false
          rollout_succeeded=false

          previous_runtime_data="$(kubectl get configmap arb-bot-runtime \
            --namespace "${GKE_NAMESPACE}" \
            -o json | jq -c '.data')"
          previous_durable_schema_version="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o json | jq -r '.metadata.annotations["arb-bot/durable-state-schema-version"] // "1"')"
          [[ "${previous_durable_schema_version}" =~ ^[0-9]+$ ]]
          if (( previous_durable_schema_version >= durable_schema_version )); then
            automatic_rollback_allowed=true
          fi

          pool_json="$(gcloud container node-pools describe "${fixed_pool}" \
            --project="${GCP_PROJECT_ID}" \
            --cluster="${GKE_CLUSTER}" \
            --zone="${GKE_ZONE}" \
            --format=json)"
          test "$(jq -r '.config.machineType' <<<"${pool_json}")" = c4-highcpu-8
          test "$(jq -r '.status' <<<"${pool_json}")" = RUNNING
          test "$(jq -r '.autoscaling.enabled // false' <<<"${pool_json}")" = false
          test "$(kubectl get nodes \
            --selector="cloud.google.com/gke-nodepool=${fixed_pool}" \
            -o json | jq '.items | length')" = 1

          restore_on_failure() {
            status="$?"
            trap - EXIT
            if [[ "${status}" -eq 0 || "${rollout_succeeded}" == true ]]; then
              exit "${status}"
            fi

            kubectl describe deployment arb-bot --namespace "${GKE_NAMESPACE}" || true
            kubectl get pods \
              --namespace "${GKE_NAMESPACE}" \
              --selector=app.kubernetes.io/name=arb-bot \
              -o wide || true
            if [[ "${rollout_applied}" == true ]]; then
              if [[ "${had_previous}" == true ]]; then
                if [[ "${automatic_rollback_allowed}" == true ]]; then
                  runtime_rollback_patch="$(jq -cn \
                    --argjson data "${previous_runtime_data}" \
                    '[{"op":"replace","path":"/data","value":$data}]')"
                  kubectl patch configmap arb-bot-runtime \
                    --namespace "${GKE_NAMESPACE}" \
                    --type=json \
                    --patch "${runtime_rollback_patch}" || true
                  kubectl rollout undo deployment/arb-bot --namespace "${GKE_NAMESPACE}" || true
                  kubectl rollout status deployment/arb-bot \
                    --namespace "${GKE_NAMESPACE}" \
                    --timeout=90s || true
                else
                  echo "::error::automatic rollback refused: durable state schema ${durable_schema_version} is not readable by previous schema ${previous_durable_schema_version}; leaving the exact forward revision and runtime projection in place"
                fi
              fi
            fi
            exit "${status}"
          }
          trap restore_on_failure EXIT

          sed \
            -e "s|__IMAGE__|${IMAGE}|g" \
            -e "s|__SOURCE_REVISION__|${SOURCE_SHA}|g" \
            -e "s|__NODE_POOL__|${fixed_pool}|g" \
            -e "s|__REBALANCE_MAX_WLD_AMOUNT__|${REBALANCE_MAX_WLD_AMOUNT}|g" \
            -e "s|__REBALANCE_MAX_USDC_AMOUNT__|${REBALANCE_MAX_USDC_AMOUNT}|g" \
            infra/gcp/gke/deployment.yaml \
            | kubectl apply --namespace "${GKE_NAMESPACE}" -f -
          rollout_applied=true

          rollout_deadline=$((SECONDS + 1800))
          while ! kubectl rollout status deployment/arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            --timeout=1s >/dev/null 2>&1; do
            pods_json="$(kubectl get pods \
              --namespace "${GKE_NAMESPACE}" \
              --selector="app.kubernetes.io/name=arb-bot,arb-bot/source-revision=${SOURCE_SHA}" \
              -o json)"
            failed_init="$(jq -r '
              [
                .items[]
                | .metadata.name as $pod
                | (.status.initContainerStatuses // [])[]
                | select(
                    (.state.terminated.exitCode // 0) != 0
                    or ((.state.waiting.reason // "") == "CrashLoopBackOff" and .restartCount > 0)
                  )
                | "\($pod)/\(.name)"
              ]
              | .[0] // empty
            ' <<<"${pods_json}")"
            if [[ -n "${failed_init}" ]]; then
              echo "init container ${failed_init} failed; triggering audited rollback" >&2
              exit 1
            fi
            failed_application="$(jq -r '
              [
                .items[]
                | .metadata.name as $pod
                | (.status.containerStatuses // [])[]
                | select(
                    (.ready | not)
                    and .restartCount >= 2
                    and (
                      (.state.waiting.reason // "") == "CrashLoopBackOff"
                      or (.lastState.terminated.exitCode // 0) != 0
                    )
                  )
                | "\($pod)/\(.name)"
              ]
              | .[0] // empty
            ' <<<"${pods_json}")"
            if [[ -n "${failed_application}" ]]; then
              echo "application container ${failed_application} repeatedly failed startup; triggering audited rollback" >&2
              exit 1
            fi
            if (( SECONDS >= rollout_deadline )); then
              echo "GKE rollout did not complete within 30 minutes" >&2
              exit 1
            fi
            sleep 5
          done
          selected_pool="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.nodeSelector.cloud\.google\.com/gke-nodepool}')"
          test "${selected_pool}" = "${fixed_pool}"
          kubectl get pods \
            --namespace "${GKE_NAMESPACE}" \
            --selector="app.kubernetes.io/name=arb-bot,arb-bot/source-revision=${SOURCE_SHA}" \
            -o wide
          runtime_config="$(kubectl get configmap arb-bot-runtime \
            --namespace "${GKE_NAMESPACE}" \
            -o json)"
          test "$(jq -r '.data.DOMAIN_CONFIG_PATH' <<<"${runtime_config}")" \
            = config/domain/compiled-multi-pair-production.v1.json
          test "$(jq -r '.data.DEX_HEAD_MAX_AGE_MS' <<<"${runtime_config}")" \
            = 30000
          test "$(jq -r '.data.BALANCE_SYNC_INTERVAL_MS' <<<"${runtime_config}")" \
            = 5000
          test "$(jq -r '.data.BALANCE_MAX_AGE_MS' <<<"${runtime_config}")" \
            = 10000
          test "$(jq -r '.data.ARBITRAGE_EXECUTION_MODE' <<<"${runtime_config}")" \
            = full_live
          test "$(jq -r '.data.REBALANCE_EXECUTION_MODE' <<<"${runtime_config}")" \
            = full_live
          esp_runtime_config="$(kubectl get configmap arb-bot-esp-market-data \
            --namespace "${GKE_NAMESPACE}" \
            -o json)"
          test "$(jq -r '.data.DOMAIN_CONFIG_PATH' <<<"${esp_runtime_config}")" \
            = config/domain/compiled-multi-pair-production.v1.json
          test "$(jq -r '.data.ARBITRAGE_EXECUTION_MODE' <<<"${esp_runtime_config}")" \
            = disabled
          test "$(jq -r '.data.REBALANCE_EXECUTION_MODE' <<<"${esp_runtime_config}")" \
            = disabled
          test "$(jq -r '.data.RUNTIME_READY_FILE' <<<"${esp_runtime_config}")" \
            = /tmp/arb-bot-esp-ready
          deployment_json="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o json)"
          test "$(jq -r '.metadata.annotations["arb-bot/durable-state-schema-version"]' \
            <<<"${deployment_json}")" = "${durable_schema_version}"
          test "$(jq -r '.spec.template.spec.containers | map(.name) | sort | join(",")' \
            <<<"${deployment_json}")" = arb-bot,esp-market-data
          test "$(jq -r '(.spec.template.spec.initContainers // []) | length' \
            <<<"${deployment_json}")" = 0
          test "$(jq -r '.spec.template.spec.containers[] | select(.name == "esp-market-data") | .args[0] | contains("collect-prices")' \
            <<<"${deployment_json}")" = true
          test "$(jq -r '.spec.template.spec.volumes[] | select(.name == "esp-market-data-secrets") | .csi.volumeAttributes.secretProviderClass' \
            <<<"${deployment_json}")" = arb-bot-esp-market-data
          pod_name="$(kubectl get pods \
            --namespace "${GKE_NAMESPACE}" \
            --selector="app.kubernetes.io/name=arb-bot,arb-bot/source-revision=${SOURCE_SHA}" \
            -o jsonpath='{.items[0].metadata.name}')"
          test -n "${pod_name}"
          rebalance_mode="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REBALANCE_EXECUTION_MODE")].value}')"
          test "${rebalance_mode}" = full_live
          rollout_succeeded=true

          echo "node_pool=${fixed_pool}" >>"${GITHUB_OUTPUT}"
          trap - EXIT

      - name: Apply rebalance monitoring
        env:
          ALERT_EMAIL: baksheev@me.com
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: GCLOUD_BIN=gcloud scripts/apply-gcp-rebalance-monitoring

      - name: Publish deployment summary
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "### GKE production deployment"
            echo
            echo "- Revision: \`${SOURCE_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Fixed node pool: \`${{ steps.rollout.outputs.node_pool }}\`"
            echo "- Cluster: \`${GKE_CLUSTER}\` in \`${GKE_ZONE}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
