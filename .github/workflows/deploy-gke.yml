name: Deploy GKE

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-gke
  cancel-in-progress: false

env:
  GCP_REGION: asia-southeast1
  GKE_ZONE: asia-southeast1-b
  GKE_CLUSTER: arb-bot
  GKE_NAMESPACE: arb-bot
  GCE_INSTANCE: arb-bot-rust-shadow-gce
  ARTIFACT_REPOSITORY: poly-bot
  IMAGE_NAME: poly-bot
  NODE_POOL_PREFIX: arb
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build and roll out immutable image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate deployment inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          EVM_WALLET_ADDRESS: ${{ vars.EVM_WALLET_ADDRESS }}
          REBALANCE_MAX_WLD_AMOUNT: ${{ vars.REBALANCE_MAX_WLD_AMOUNT }}
          REBALANCE_MAX_USDC_AMOUNT: ${{ vars.REBALANCE_MAX_USDC_AMOUNT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git branch --show-current)" = "" || test "$(git branch --show-current)" = "main"
          test -n "${GCP_PROJECT_ID}"
          test -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${GCP_DEPLOY_SERVICE_ACCOUNT}"
          [[ "${EVM_WALLET_ADDRESS}" =~ ^0x[0-9a-fA-F]{40}$ ]]
          for limit in "${REBALANCE_MAX_WLD_AMOUNT}" "${REBALANCE_MAX_USDC_AMOUNT}"; do
            [[ "${limit}" =~ ^[0-9]+([.][0-9]+)?$ ]]
            test -n "${limit//[0.]/}"
          done
          domain_config=config/domain/compiled-multi-pair-production.v1.json
          test "$(jq -r '.bundle_kind' "${domain_config}")" = compiled_multi_pair_domain
          test "$(jq -r '.bundle_id' "${domain_config}")" = arb-bot-production-multi-pair-v1
          test "$(jq -c '.instruments | map(.symbol)' "${domain_config}")" \
            = '["ESPUSDC","WLDUSDC"]'
          test "$(jq -c '.stream_shards' "${domain_config}")" = \
            '[{"id":"stream:binance-spot:primary:0","account_id":"binance-spot:primary","instrument_ids":["binance-spot:primary:ESPUSDC","binance-spot:primary:WLDUSDC"]}]'
          test "$(jq -c '[.venue_assets[] | select(.kind == "binance_spot") | .symbol]' "${domain_config}")" \
            = '["BNB","ESP","USDC","WLD"]'
          test "$(jq -c '.networks | map(.id)' "${domain_config}")" \
            = '["eip155:42161","eip155:480"]'
          test "$(jq -c '.capabilities' "${domain_config}")" = \
            '[{"strategy_id":"strategy:arbitrum-usdc-esp","observe":true,"plan":true,"execute":true,"rebalance":true},{"strategy_id":"strategy:world-chain-usdc-wld","observe":true,"plan":true,"execute":true,"rebalance":true}]'
          test "$(jq -r '.compatibility_projections[] | select(.role == "live_runtime") | .source_snapshot_id' "${domain_config}")" \
            = arb-bot-production-usdc-wld-world-chain-v12-binance-transport-liveness
          test "$(jq -r '.compatibility_projections[] | select(.role == "public_price_collector") | .source_snapshot_id' "${domain_config}")" \
            = arb-bot-production-usdc-esp-arbitrum-v6-full-live
          wld='.sources[] | select(.snapshot.pairs[0].id == "world-chain-usdc-wld") | .snapshot'
          test "$(jq -r "${wld} | .pairs[0].adaptive_sizing.mode" "${domain_config}")" = adaptive
          test "$(jq -r "${wld} | .pairs[0].adaptive_sizing.max_trade_notional_token_a_base_units" "${domain_config}")" = 200000000
          test "$(jq -r "${wld} | .pairs[0].quote_sizing.token_a_base_units" "${domain_config}")" = 20000000
          test "$(jq -r "${wld} | .pairs[0].strategy.opportunity_threshold_bps" "${domain_config}")" = 20
          test "$(jq -r "${wld} | .pairs[0].strategy.max_quote_age_ms" "${domain_config}")" = 30000
          test "$(jq -r "${wld} | .pairs[0].strategy.max_transport_silence_ms" "${domain_config}")" = 30000
          test "$(jq -r "${wld} | .pairs[0].adaptive_sizing.min_expected_profit_token_a_base_units" "${domain_config}")" = 0
          test "$(jq -r "${wld} | .pairs[0].adaptive_sizing.depth_policy.recent_full_depth_max_age_ms" "${domain_config}")" = 750
          test "$(jq -r "${wld} | .pairs[0].adaptive_sizing.depth_policy.recent_full_depth_max_update_delta" "${domain_config}")" = 8
          test "$(jq -r "${wld} | .pairs[0].adaptive_sizing.depth_policy.top_of_book_max_trade_notional_token_a_base_units" "${domain_config}")" = 40000000
          test "$(jq -r "${wld} | .pairs[0].strategy | has(\"balance_safety_multiplier\")" "${domain_config}")" = false
          esp='.sources[] | select(.snapshot.pairs[0].id == "arbitrum-usdc-esp") | .snapshot'
          test "$(jq -r "${esp} | .live_trading_enabled" "${domain_config}")" = true
          test "$(jq -r "${esp} | .source.rails_pair_candidate_id" "${domain_config}")" = 3144
          test "$(jq -r "${esp} | .pairs | length" "${domain_config}")" = 1
          test "$(jq -r "${esp} | .pairs[0].id" "${domain_config}")" = arbitrum-usdc-esp
          test "$(jq -r "${esp} | .pairs[0].chain.chain_id" "${domain_config}")" = 42161
          test "$(jq -r "${esp} | .pairs[0].binance.symbol" "${domain_config}")" = ESPUSDC
          test "$(jq -r "${esp} | .pairs[0].market_data_enabled" "${domain_config}")" = true
          test "$(jq -r "${esp} | .pairs[0].execution_enabled" "${domain_config}")" = true
          test "$(jq -r "${esp} | .pairs[0].full_live" "${domain_config}")" = true
          test "$(jq -r "${esp} | .pairs[0].rebalance.enabled" "${domain_config}")" = true
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.mode" "${domain_config}")" = adaptive
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.max_trade_notional_token_a_base_units" "${domain_config}")" = 200000000
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.max_unhedged_notional_token_a_base_units" "${domain_config}")" = 220000000
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.max_recovery_loss_token_a_base_units" "${domain_config}")" = 2000000
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.min_expected_profit_token_a_base_units" "${domain_config}")" = 0
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.min_incremental_expected_profit_token_a_base_units" "${domain_config}")" = 0
          test "$(jq -r "${esp} | .pairs[0].quote_sizing.token_a_base_units" "${domain_config}")" = 20000000
          test "$(jq -r "${esp} | .pairs[0].strategy.opportunity_threshold_bps" "${domain_config}")" = 20
          test "$(jq -r "${esp} | .pairs[0].strategy.max_quote_age_ms" "${domain_config}")" = 30000
          test "$(jq -r "${esp} | .pairs[0].strategy.max_transport_silence_ms" "${domain_config}")" = 30000
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.depth_policy.recent_full_depth_max_age_ms" "${domain_config}")" = 750
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.depth_policy.recent_full_depth_max_update_delta" "${domain_config}")" = 8
          test "$(jq -r "${esp} | .pairs[0].adaptive_sizing.depth_policy.top_of_book_max_trade_notional_token_a_base_units" "${domain_config}")" = 40000000
          test "$(jq -r "${esp} | .pairs[0].strategy | has(\"balance_safety_multiplier\")" "${domain_config}")" = false
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.production_approval_actor" "${domain_config}")" = operator
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.production_approval_recorded_at_utc" "${domain_config}")" = 2026-07-31T11:00:00Z
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.arbitrum_max_fee_headroom_bps" "${domain_config}")" = 12000
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.router_allowance_mode" "${domain_config}")" = max_uint256_then_locked
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.rebalance_binance_network" "${domain_config}")" = ARBITRUM
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.maximum_rebalance_token_a_debit_base_units" "${domain_config}")" = 2600000000
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.maximum_rebalance_token_b_debit_base_units" "${domain_config}")" = 10000000000000000000000
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.maximum_rebalance_token_a_fee_base_units" "${domain_config}")" = 5000000
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.maximum_rebalance_token_b_fee_base_units" "${domain_config}")" = 2000000000000000000
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.maximum_unknown_reconciliation_queries" "${domain_config}")" = 1
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.direct_route_only" "${domain_config}")" = true
          test "$(jq -r "${esp} | .pairs[0].full_live_policy.bridge_mutations_enabled" "${domain_config}")" = false
          test "$(jq -r "${esp} | .pairs[0].chain.uniswap_v3_router_address" "${domain_config}")" \
            = 0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45
          test "$(jq -r "${esp} | .pairs[0].chain.uniswap_v3_quoter_address" "${domain_config}")" \
            = 0x61fFE014bA17989E743c5F6cB21bF9697530B21e
          test "$(jq -r "${esp} | .pairs[0].chain | has(\"uniswap_v4_router_address\")" "${domain_config}")" = false
          test "$(jq -c "${esp} | .pairs[0].dex.allowed_providers" "${domain_config}")" \
            = '["uniswap_v3"]'
          test "$(jq -c "${esp} | .pairs[0].dex.uniswap_v3.fee_tiers" "${domain_config}")" \
            = '[100]'
          test "$(jq -r "${esp} | .pairs[0].dex | has(\"uniswap_v4\")" "${domain_config}")" = false
          test "$(jq -r "${esp} | .pairs[0].chain | has(\"uniswap_v4_quoter_address\")" "${domain_config}")" = false
          test "$(jq -r "${esp} | .pairs[0].chain | has(\"uniswap_v4_pool_manager_address\")" "${domain_config}")" = false
          test "$(jq -r "${esp} | .pairs[0].chain | has(\"uniswap_v4_state_view_address\")" "${domain_config}")" = false
          test "${GITHUB_REF}" = "refs/heads/main" || test "${GITHUB_EVENT_NAME}" = "workflow_run"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            successful_ci="$(gh run list \
              --workflow CI \
              --commit "${SOURCE_SHA}" \
              --limit 20 \
              --json conclusion \
              --jq 'any(.[]; .conclusion == "success")')"
            test "${successful_ci}" = "true"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: alpha

      - name: Verify GCE live owner is stopped
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          status="$(gcloud compute instances describe "${GCE_INSTANCE}" \
            --zone="${GKE_ZONE}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(status)')"
          test "${status}" = "TERMINATED"

      - name: Build and push immutable image
        id: image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          image_tag="${registry}/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${SOURCE_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker build \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "${image_tag}" \
            .
          docker push "${image_tag}"
          digest="$(gcloud artifacts docker images describe \
            "${image_tag}" \
            --format='value(image_summary.digest)')"
          test "${digest#sha256:}" != "${digest}"
          test "${#digest}" -eq 71
          image="${registry}/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}@${digest}"
          echo "image=${image}" >>"${GITHUB_OUTPUT}"

      - name: Get private cluster credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          namespace: ${{ env.GKE_NAMESPACE }}
          use_dns_based_endpoint: true

      - name: Apply ClickHouse telemetry migrations
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -Eeuo pipefail
          migration_deployment="arb-bot-ch-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_migration() {
            kubectl delete deployment "${migration_deployment}" \
              --namespace "${GKE_NAMESPACE}" \
              --ignore-not-found \
              --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup_migration EXIT

          node_pool="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.nodeSelector.cloud\.google\.com/gke-nodepool}')"
          test -n "${node_pool}"

          migration_json="$(kubectl create deployment "${migration_deployment}" \
            --namespace "${GKE_NAMESPACE}" \
            --image="${IMAGE}" \
            --dry-run=client \
            -o json \
            -- /bin/sh -ec 'sleep 300')"
          jq \
            --arg image "${IMAGE}" \
            --arg node_pool "${node_pool}" \
            --arg migration_instance "${migration_deployment}" \
            '
              .metadata.labels["app.kubernetes.io/name"] = "arb-bot-ch-migrate"
              | .metadata.labels["arb-bot/migration-instance"] = $migration_instance
              | .spec.replicas = 1
              | .spec.revisionHistoryLimit = 0
              | .spec.strategy = {"type": "Recreate"}
              | .spec.selector.matchLabels = {
                  "app.kubernetes.io/name": "arb-bot-ch-migrate",
                  "arb-bot/migration-instance": $migration_instance
                }
              | .spec.template.metadata.labels["app.kubernetes.io/name"] = "arb-bot-ch-migrate"
              | .spec.template.metadata.labels["arb-bot/migration-instance"] = $migration_instance
              | .spec.template.spec.serviceAccountName = "arb-bot-runtime"
              | .spec.template.spec.nodeSelector = {
                  "cloud.google.com/gke-nodepool": $node_pool
                }
              | .spec.template.spec.securityContext = {
                  "runAsNonRoot": true,
                  "runAsUser": 65532,
                  "runAsGroup": 65532,
                  "fsGroup": 65532,
                  "seccompProfile": {"type": "RuntimeDefault"}
                }
              | .spec.template.spec.containers[0].name = "hold"
              | .spec.template.spec.containers[0].command = ["/bin/sh", "-ec"]
              | .spec.template.spec.containers[0].args = ["sleep 300"]
              | .spec.template.spec.containers[0].resources = {
                  "requests": {"cpu": "5m", "memory": "8Mi"},
                  "limits": {"cpu": "20m", "memory": "16Mi"}
                }
              | .spec.template.spec.containers[0].securityContext = {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {"drop": ["ALL"]}
                }
              | .spec.template.spec.initContainers = [{
                  "name": "migrate",
                  "image": $image,
                  "imagePullPolicy": "IfNotPresent",
                  "command": ["/bin/sh", "-ec"],
                  "args": [
                    "export CLICKHOUSE_URL=\"$(cat /var/run/secrets/arb-bot-ch/CLICKHOUSE_URL)\"; export CLICKHOUSE_PASSWORD=\"$(cat /var/run/secrets/arb-bot-ch/CLICKHOUSE_PASSWORD)\"; export CLICKHOUSE_USER=default; export CLICKHOUSE_DATABASE=arb_bot_prod; exec arb_bot migrate"
                  ],
                  "resources": {
                    "requests": {"cpu": "25m", "memory": "32Mi"},
                    "limits": {"cpu": "250m", "memory": "128Mi"}
                  },
                  "securityContext": {
                    "allowPrivilegeEscalation": false,
                    "readOnlyRootFilesystem": true,
                    "capabilities": {"drop": ["ALL"]}
                  },
                  "volumeMounts": [{
                    "name": "clickhouse-secrets",
                    "mountPath": "/var/run/secrets/arb-bot-ch",
                    "readOnly": true
                  }]
                }]
              | .spec.template.spec.volumes = [{
                  "name": "clickhouse-secrets",
                  "csi": {
                    "driver": "secrets-store-gke.csi.k8s.io",
                    "readOnly": true,
                    "volumeAttributes": {
                      "secretProviderClass": "arb-bot-esp-market-data"
                    }
                  }
                }]
            ' <<<"${migration_json}" \
            | kubectl apply --namespace "${GKE_NAMESPACE}" -f -

          migration_pod=
          for _ in {1..60}; do
            migration_pod="$(kubectl get pods \
              --namespace "${GKE_NAMESPACE}" \
              --selector="arb-bot/migration-instance=${migration_deployment}" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            test -z "${migration_pod}" || break
            sleep 2
          done
          test -n "${migration_pod}"

          migration_reason=
          for _ in {1..60}; do
            migration_reason="$(kubectl get pod "${migration_pod}" \
              --namespace "${GKE_NAMESPACE}" \
              -o jsonpath='{.status.initContainerStatuses[0].state.terminated.reason}' \
              2>/dev/null || true)"
            case "${migration_reason}" in
              Completed) break ;;
              Error)
                kubectl describe pod "${migration_pod}" \
                  --namespace "${GKE_NAMESPACE}" || true
                exit 1
                ;;
            esac
            sleep 2
          done
          if test "${migration_reason}" != Completed; then
            kubectl describe pod "${migration_pod}" \
              --namespace "${GKE_NAMESPACE}" || true
            exit 1
          fi

      - name: Gate exact image with capacity maximum-pair replay on target C4
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          test "$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.replicas}')" = 1
          node_pool="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.nodeSelector.cloud\.google\.com/gke-nodepool}')"
          test -n "${node_pool}"
          machine_type="$(gcloud container node-pools describe "${node_pool}" \
            --project="${GCP_PROJECT_ID}" \
            --cluster="${GKE_CLUSTER}" \
            --zone="${GKE_ZONE}" \
            --format='value(config.machineType)')"
          test "${machine_type}" = c4-highcpu-8

          replay_deployment="arb-bot-capacity-replay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_replay() {
            kubectl delete deployment "${replay_deployment}" \
              --namespace "${GKE_NAMESPACE}" \
              --ignore-not-found \
              --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup_replay EXIT

          deployment_json="$(kubectl create deployment "${replay_deployment}" \
            --namespace "${GKE_NAMESPACE}" \
            --image="${IMAGE}" \
            --dry-run=client \
            -o json \
            -- /bin/sh -ec 'sleep 300')"
          jq \
            --arg node_pool "${node_pool}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg replay_instance "${replay_deployment}" \
            --arg image "${IMAGE}" \
            '
              .metadata.labels["app.kubernetes.io/name"] = "arb-bot-capacity-replay"
              | .metadata.labels["arb-bot/source-revision"] = $source_sha
              | .metadata.labels["arb-bot/replay-instance"] = $replay_instance
              | .spec.replicas = 1
              | .spec.revisionHistoryLimit = 0
              | .spec.strategy = {"type": "Recreate"}
              | .spec.selector.matchLabels = {
                  "app.kubernetes.io/name": "arb-bot-capacity-replay",
                  "arb-bot/replay-instance": $replay_instance
                }
              | .spec.template.metadata.labels["app.kubernetes.io/name"] = "arb-bot-capacity-replay"
              | .spec.template.metadata.labels["arb-bot/source-revision"] = $source_sha
              | .spec.template.metadata.labels["arb-bot/replay-instance"] = $replay_instance
              | .spec.template.spec.automountServiceAccountToken = false
              | .spec.template.spec.nodeSelector = {
                  "cloud.google.com/gke-nodepool": $node_pool
                }
              | .spec.template.spec.securityContext = {
                  "runAsNonRoot": true,
                  "runAsUser": 65532,
                  "runAsGroup": 65532,
                  "seccompProfile": {"type": "RuntimeDefault"}
                }
              | .spec.template.spec.containers[0].name = "hold"
              | .spec.template.spec.containers[0].resources = {
                  "requests": {"cpu": "5m", "memory": "8Mi"},
                  "limits": {"cpu": "20m", "memory": "16Mi"}
                }
              | .spec.template.spec.containers[0].securityContext = {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {"drop": ["ALL"]}
                }
              | .spec.template.spec.initContainers = [{
                  "name": "replay",
                  "image": $image,
                  "imagePullPolicy": "IfNotPresent",
                  "command": ["/bin/sh", "-ec"],
                  "args": [
                    "report=\"$(arb_bot replay-capacity --target-cpu-class c4-highcpu-8)\"; printf \"%s\\n\" \"${report}\" | tee /dev/termination-log"
                  ],
                  "resources": {
                    "requests": {"cpu": "250m", "memory": "128Mi"},
                    "limits": {"cpu": "1", "memory": "256Mi"}
                  },
                  "securityContext": {
                    "allowPrivilegeEscalation": false,
                    "readOnlyRootFilesystem": true,
                    "capabilities": {"drop": ["ALL"]}
                  },
                  "terminationMessagePath": "/dev/termination-log",
                  "terminationMessagePolicy": "File"
                }]
            ' <<<"${deployment_json}" \
            | kubectl apply --namespace "${GKE_NAMESPACE}" -f -

          replay_pod=
          for _ in {1..60}; do
            replay_pod="$(kubectl get pods \
              --namespace "${GKE_NAMESPACE}" \
              --selector="arb-bot/replay-instance=${replay_deployment}" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            test -z "${replay_pod}" || break
            sleep 2
          done
          test -n "${replay_pod}"

          replay_reason=
          for _ in {1..150}; do
            replay_reason="$(kubectl get pod "${replay_pod}" \
              --namespace "${GKE_NAMESPACE}" \
              -o jsonpath='{.status.initContainerStatuses[0].state.terminated.reason}' \
              2>/dev/null || true)"
            replay_scheduling_reason="$(kubectl get pod "${replay_pod}" \
              --namespace "${GKE_NAMESPACE}" \
              -o jsonpath='{.status.conditions[?(@.type=="PodScheduled")].reason}' \
              2>/dev/null || true)"
            case "${replay_reason}" in
              Completed) break ;;
              Error)
                kubectl describe pod "${replay_pod}" --namespace "${GKE_NAMESPACE}" || true
                exit 1
                ;;
            esac
            if test "${replay_scheduling_reason}" = Unschedulable; then
              kubectl describe pod "${replay_pod}" --namespace "${GKE_NAMESPACE}" || true
              exit 1
            fi
            sleep 2
          done
          if test "${replay_reason}" != Completed; then
            kubectl describe pod "${replay_pod}" --namespace "${GKE_NAMESPACE}" || true
            exit 1
          fi

          replay_node="$(kubectl get pod "${replay_pod}" \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.nodeName}')"
          test -n "${replay_node}"
          test "$(kubectl get pod "${replay_pod}" \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.nodeSelector.cloud\.google\.com/gke-nodepool}')" = "${node_pool}"

          replay_report="$(kubectl get pod "${replay_pod}" \
            --namespace "${GKE_NAMESPACE}" \
            -o json \
            | jq -r '.status.initContainerStatuses[0].state.terminated.message')"
          jq -e '
            .artifact_id == "maximum-pair-replay-v1"
            and .mode == "capacity_replay_only"
            and .pair_count == 20
            and .pool_count == 23
            and .frames_per_pair == 100000
            and .total_strategy_frames == 2000000
            and .reconnect_bursts == 4
            and .total_reconnect_events == 160
            and .exact_single_strategy_routes == 2000160
            and .route_failures == 0
            and .dependency_faults == 0
            and (.evaluations_by_symbol | length) == 20
            and ([.evaluations_by_symbol[] == 100000] | all)
            and .decision_owner_latency.samples == 2000000
            and .decision_owner_latency.p99_ns <= 25000
            and .fairness.maximum_workers == 4
            and .fairness.maximum_observed_running <= 4
            and .fairness.unique_strategies_before_noisy_repeat == 20
            and .fairness.maximum_retained_work <= 24
            and .rehydration.cycles == 5
            and .rehydration.pool_publications == 115
            and .rehydration.partial_batches_rejected == 1
            and .rehydration.captured_batch_materialization_latency.p99_ns <= 25000
            and .rehydration.decode_latency.p99_ns <= 25000
            and .rehydration.pool_build_latency.p99_ns <= 200000
            and .rehydration.publication_latency.p99_ns <= 25000
            and .network_io_performed == false
            and .external_mutations == 0
            and .target_cpu_class == "c4-highcpu-8"
            and (.rss_before_bytes | type) == "number"
            and (.rss_after_bytes | type) == "number"
            and (.rss_high_water_bytes | type) == "number"
            and .gate == "target_c4_replay_ready"
          ' <<<"${replay_report}" >/dev/null
          echo "${replay_report}"

      - name: Roll out on the fixed node
        id: rollout
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          EVM_WALLET_ADDRESS: ${{ vars.EVM_WALLET_ADDRESS }}
          REBALANCE_MAX_WLD_AMOUNT: ${{ vars.REBALANCE_MAX_WLD_AMOUNT }}
          REBALANCE_MAX_USDC_AMOUNT: ${{ vars.REBALANCE_MAX_USDC_AMOUNT }}
        run: |
          set -Eeuo pipefail
          release_id="${SOURCE_SHA:0:12}"
          new_pool="${NODE_POOL_PREFIX}-${release_id}"
          had_previous=false
          previous_pool=""
          previous_runtime_data="null"
          previous_durable_schema_version=0
          durable_schema_version=2
          automatic_rollback_allowed=false
          rollout_applied=false
          rollout_succeeded=false

          if kubectl get deployment arb-bot --namespace "${GKE_NAMESPACE}" >/dev/null 2>&1; then
            had_previous=true
            previous_pool="$(kubectl get deployment arb-bot \
              --namespace "${GKE_NAMESPACE}" \
              -o jsonpath='{.spec.template.spec.nodeSelector.cloud\.google\.com/gke-nodepool}')"
            test -n "${previous_pool}"
            new_pool="${previous_pool}"
            previous_runtime_data="$(kubectl get configmap arb-bot-runtime \
              --namespace "${GKE_NAMESPACE}" \
              -o json | jq -c '.data')"
            previous_durable_schema_version="$(kubectl get deployment arb-bot \
              --namespace "${GKE_NAMESPACE}" \
              -o json | jq -r '.metadata.annotations["arb-bot/durable-state-schema-version"] // "1"')"
            [[ "${previous_durable_schema_version}" =~ ^[0-9]+$ ]]
            if (( previous_durable_schema_version >= durable_schema_version )); then
              automatic_rollback_allowed=true
            fi
          fi

          restore_on_failure() {
            status="$?"
            trap - EXIT
            if [[ "${status}" -eq 0 || "${rollout_succeeded}" == true ]]; then
              exit "${status}"
            fi

            kubectl describe deployment arb-bot --namespace "${GKE_NAMESPACE}" || true
            kubectl get pods \
              --namespace "${GKE_NAMESPACE}" \
              --selector=app.kubernetes.io/name=arb-bot \
              -o wide || true
            if [[ "${rollout_applied}" == true ]]; then
              if [[ "${had_previous}" == true ]]; then
                if [[ "${automatic_rollback_allowed}" == true ]]; then
                  runtime_rollback_patch="$(jq -cn \
                    --argjson data "${previous_runtime_data}" \
                    '[{"op":"replace","path":"/data","value":$data}]')"
                  kubectl patch configmap arb-bot-runtime \
                    --namespace "${GKE_NAMESPACE}" \
                    --type=json \
                    --patch "${runtime_rollback_patch}" || true
                  kubectl rollout undo deployment/arb-bot --namespace "${GKE_NAMESPACE}" || true
                  kubectl rollout status deployment/arb-bot \
                    --namespace "${GKE_NAMESPACE}" \
                    --timeout=90s || true
                else
                  echo "::error::automatic rollback refused: durable state schema ${durable_schema_version} is not readable by previous schema ${previous_durable_schema_version}; leaving the exact forward revision and runtime projection in place"
                fi
              else
                kubectl delete deployment arb-bot \
                  --namespace "${GKE_NAMESPACE}" \
                  --ignore-not-found || true
              fi
            fi

            if [[ "${new_pool}" != "${previous_pool}" ]]; then
              gcloud container node-pools delete "${new_pool}" \
                --project="${GCP_PROJECT_ID}" \
                --cluster="${GKE_CLUSTER}" \
                --zone="${GKE_ZONE}" \
                --quiet || true
            fi
            exit "${status}"
          }
          trap restore_on_failure EXIT

          # Cancelled deployments can leave immutable release pools behind.
          # Remove only pools that are not selected by the current Deployment
          # before creating the next one, so quota cleanup cannot evict the
          # active workload.
          while IFS= read -r pool; do
            if [[ -n "${pool}" \
              && "${pool}" != "${previous_pool}" \
              && "${pool}" != "${new_pool}" \
              && "${pool}" == arb-* ]]; then
              gcloud container node-pools delete "${pool}" \
                --project="${GCP_PROJECT_ID}" \
                --cluster="${GKE_CLUSTER}" \
                --zone="${GKE_ZONE}" \
                --quiet
            fi
          done < <(gcloud container node-pools list \
            --project="${GCP_PROJECT_ID}" \
            --cluster="${GKE_CLUSTER}" \
            --zone="${GKE_ZONE}" \
            --format='value(name)')

          GCP_PROJECT_ID="${GCP_PROJECT_ID}" \
          GKE_CLUSTER="${GKE_CLUSTER}" \
          GKE_ZONE="${GKE_ZONE}" \
          GKE_RELEASE_ID="${release_id}" \
          GCLOUD_BIN=gcloud \
            scripts/create-gke-node-pool "${new_pool}"

          sed \
            -e "s|__GCP_PROJECT_ID__|${GCP_PROJECT_ID}|g" \
            -e "s|__EVM_WALLET_ADDRESS__|${EVM_WALLET_ADDRESS}|g" \
            -e "s|__GCP_DEPLOY_SERVICE_ACCOUNT__|${GCP_DEPLOY_SERVICE_ACCOUNT}|g" \
            infra/gcp/gke/release-platform.yaml \
            | kubectl apply -f -

          if kubectl get persistentvolumeclaim arb-bot-state \
            --namespace "${GKE_NAMESPACE}" >/dev/null 2>&1; then
            existing_storage_class="$(kubectl get persistentvolumeclaim arb-bot-state \
              --namespace "${GKE_NAMESPACE}" \
              -o jsonpath='{.spec.storageClassName}')"
            if [[ "${existing_storage_class}" != dynamic-rwo ]]; then
              test "${had_previous}" = false
              kubectl delete persistentvolumeclaim arb-bot-state \
                --namespace "${GKE_NAMESPACE}" \
                --wait=true
            fi
          fi

          sed \
            -e "s|__IMAGE__|${IMAGE}|g" \
            -e "s|__SOURCE_REVISION__|${SOURCE_SHA}|g" \
            -e "s|__NODE_POOL__|${new_pool}|g" \
            -e "s|__REBALANCE_MAX_WLD_AMOUNT__|${REBALANCE_MAX_WLD_AMOUNT}|g" \
            -e "s|__REBALANCE_MAX_USDC_AMOUNT__|${REBALANCE_MAX_USDC_AMOUNT}|g" \
            infra/gcp/gke/deployment.yaml \
            | kubectl apply --namespace "${GKE_NAMESPACE}" -f -
          rollout_applied=true

          rollout_deadline=$((SECONDS + 1800))
          while ! kubectl rollout status deployment/arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            --timeout=1s >/dev/null 2>&1; do
            pods_json="$(kubectl get pods \
              --namespace "${GKE_NAMESPACE}" \
              --selector="app.kubernetes.io/name=arb-bot,arb-bot/source-revision=${SOURCE_SHA}" \
              -o json)"
            failed_init="$(jq -r '
              [
                .items[]
                | .metadata.name as $pod
                | (.status.initContainerStatuses // [])[]
                | select(
                    (.state.terminated.exitCode // 0) != 0
                    or ((.state.waiting.reason // "") == "CrashLoopBackOff" and .restartCount > 0)
                  )
                | "\($pod)/\(.name)"
              ]
              | .[0] // empty
            ' <<<"${pods_json}")"
            if [[ -n "${failed_init}" ]]; then
              echo "init container ${failed_init} failed; triggering audited rollback" >&2
              exit 1
            fi
            failed_application="$(jq -r '
              [
                .items[]
                | .metadata.name as $pod
                | (.status.containerStatuses // [])[]
                | select(
                    (.ready | not)
                    and .restartCount >= 2
                    and (
                      (.state.waiting.reason // "") == "CrashLoopBackOff"
                      or (.lastState.terminated.exitCode // 0) != 0
                    )
                  )
                | "\($pod)/\(.name)"
              ]
              | .[0] // empty
            ' <<<"${pods_json}")"
            if [[ -n "${failed_application}" ]]; then
              echo "application container ${failed_application} repeatedly failed startup; triggering audited rollback" >&2
              exit 1
            fi
            if (( SECONDS >= rollout_deadline )); then
              echo "GKE rollout did not complete within 30 minutes" >&2
              exit 1
            fi
            sleep 5
          done
          selected_pool="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.nodeSelector.cloud\.google\.com/gke-nodepool}')"
          test "${selected_pool}" = "${new_pool}"
          kubectl get pods \
            --namespace "${GKE_NAMESPACE}" \
            --selector="app.kubernetes.io/name=arb-bot,arb-bot/source-revision=${SOURCE_SHA}" \
            -o wide
          runtime_config="$(kubectl get configmap arb-bot-runtime \
            --namespace "${GKE_NAMESPACE}" \
            -o json)"
          test "$(jq -r '.data.DOMAIN_CONFIG_PATH' <<<"${runtime_config}")" \
            = config/domain/compiled-multi-pair-production.v1.json
          test "$(jq -r '.data.DEX_HEAD_MAX_AGE_MS' <<<"${runtime_config}")" \
            = 30000
          test "$(jq -r '.data.BALANCE_SYNC_INTERVAL_MS' <<<"${runtime_config}")" \
            = 5000
          test "$(jq -r '.data.BALANCE_MAX_AGE_MS' <<<"${runtime_config}")" \
            = 10000
          test "$(jq -r '.data.ARBITRAGE_EXECUTION_MODE' <<<"${runtime_config}")" \
            = full_live
          test "$(jq -r '.data.REBALANCE_EXECUTION_MODE' <<<"${runtime_config}")" \
            = full_live
          esp_runtime_config="$(kubectl get configmap arb-bot-esp-market-data \
            --namespace "${GKE_NAMESPACE}" \
            -o json)"
          test "$(jq -r '.data.DOMAIN_CONFIG_PATH' <<<"${esp_runtime_config}")" \
            = config/domain/compiled-multi-pair-production.v1.json
          test "$(jq -r '.data.ARBITRAGE_EXECUTION_MODE' <<<"${esp_runtime_config}")" \
            = disabled
          test "$(jq -r '.data.REBALANCE_EXECUTION_MODE' <<<"${esp_runtime_config}")" \
            = disabled
          test "$(jq -r '.data.RUNTIME_READY_FILE' <<<"${esp_runtime_config}")" \
            = /tmp/arb-bot-esp-ready
          deployment_json="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o json)"
          test "$(jq -r '.metadata.annotations["arb-bot/durable-state-schema-version"]' \
            <<<"${deployment_json}")" = "${durable_schema_version}"
          test "$(jq -r '.spec.template.spec.containers | map(.name) | sort | join(",")' \
            <<<"${deployment_json}")" = arb-bot,esp-market-data
          test "$(jq -r '(.spec.template.spec.initContainers // []) | length' \
            <<<"${deployment_json}")" = 0
          test "$(jq -r '.spec.template.spec.containers[] | select(.name == "esp-market-data") | .args[0] | contains("collect-prices")' \
            <<<"${deployment_json}")" = true
          test "$(jq -r '.spec.template.spec.volumes[] | select(.name == "esp-market-data-secrets") | .csi.volumeAttributes.secretProviderClass' \
            <<<"${deployment_json}")" = arb-bot-esp-market-data
          pod_name="$(kubectl get pods \
            --namespace "${GKE_NAMESPACE}" \
            --selector="app.kubernetes.io/name=arb-bot,arb-bot/source-revision=${SOURCE_SHA}" \
            -o jsonpath='{.items[0].metadata.name}')"
          test -n "${pod_name}"
          rebalance_mode="$(kubectl get deployment arb-bot \
            --namespace "${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REBALANCE_EXECUTION_MODE")].value}')"
          test "${rebalance_mode}" = full_live
          rollout_succeeded=true

          while IFS= read -r pool; do
            if [[ -n "${pool}" && "${pool}" != "${new_pool}" && "${pool}" == arb-* ]]; then
              gcloud container node-pools delete "${pool}" \
                --project="${GCP_PROJECT_ID}" \
                --cluster="${GKE_CLUSTER}" \
                --zone="${GKE_ZONE}" \
                --quiet
            fi
          done < <(gcloud container node-pools list \
            --project="${GCP_PROJECT_ID}" \
            --cluster="${GKE_CLUSTER}" \
            --zone="${GKE_ZONE}" \
            --format='value(name)')

          echo "node_pool=${new_pool}" >>"${GITHUB_OUTPUT}"
          trap - EXIT

      - name: Apply rebalance monitoring
        env:
          ALERT_EMAIL: baksheev@me.com
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: GCLOUD_BIN=gcloud scripts/apply-gcp-rebalance-monitoring

      - name: Publish deployment summary
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "### GKE production deployment"
            echo
            echo "- Revision: \`${SOURCE_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Fixed node pool: \`${{ steps.rollout.outputs.node_pool }}\`"
            echo "- Cluster: \`${GKE_CLUSTER}\` in \`${GKE_ZONE}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
